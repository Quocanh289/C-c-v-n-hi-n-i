# ====================================================
# Emotion Lens - Full Stack Deployment
# docker-compose.yml for production infrastructure
# ====================================================

services:
  # ---- API Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emotion-lens-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEVICE=cpu
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=emotionlens
      - POSTGRES_USER=emotionlens
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MODEL_SAVE_DIR=/models/checkpoints
      - FEEDBACK_DIR=/data/feedback
      - MONITORING_DIR=/data/monitoring
    volumes:
      - ./models:/models
      - ./data:/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ---- Redis Cache ----
  redis:
    image: redis:7-alpine
    container_name: emotion-lens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: emotion-lens-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=emotionlens
      - POSTGRES_USER=emotionlens
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotionlens -d emotionlens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Qdrant Vector Database ----
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: emotion-lens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- Celery Worker ----
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emotion-lens-celery
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEVICE=cpu
      - MODEL_SAVE_DIR=/models/checkpoints
      - FEEDBACK_DIR=/data/feedback
    volumes:
      - ./models:/models
      - ./data:/data
    depends_on:
      - redis
      - backend
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # ---- Celery Beat (Scheduled Tasks) ----
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emotion-lens-celery-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/data
    depends_on:
      - redis
      - backend

  # ---- Monitoring (Prometheus + Grafana) ----
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: emotion-lens-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.2.0
    container_name: emotion-lens-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources

  # ---- Flower (Celery Monitoring) ----
  flower:
    image: mher/flower:2.0
    container_name: emotion-lens-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      - redis
      - celery

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data: